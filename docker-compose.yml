version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "8789:8789"
    environment:
      - GEMINI_API_KEY=API_KEY
      - GEMINI_MODEL=gemini-3.8-flash
      - PORT=8789
      - CLIENT_ORIGIN=http://localhost:5174
      - MAX_FILE_SIZE_MB=15

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
